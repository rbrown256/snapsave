name: Test Scripts
on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pipenv'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv install --dev
          
      - name: Create dummy configuration files
        run: |
          # Create dummy Dropbox token for snapsave.py
          echo "dummy_dropbox_token_12345" > access_token.tkn
          
          # Generate a structurally valid (but fake) 1024-bit RSA private key on the fly
          # The awk command formats the output with literal \n characters required by JSON
          DUMMY_KEY=$(openssl genrsa 1024 2>/dev/null | awk '{printf "%s\\n", $0}')
          
          # Create dummy Google Service Account JSON for the g-drive scripts
          cat <<EOF > gdrive.json
          {
            "type": "service_account",
            "project_id": "dummy-project",
            "private_key_id": "dummy-key-id",
            "private_key": "$DUMMY_KEY",
            "client_email": "dummy@dummy-project.iam.gserviceaccount.com",
            "client_id": "1234567890",
            "auth_uri": "https://accounts.google.com/o/oauth2/auth",
            "token_uri": "https://oauth2.googleapis.com/token",
            "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
            "client_x509_cert_url": "https://www.googleapis.com/robot/v1/metadata/x509/dummy%40dummy-project.iam.gserviceaccount.com",
            "universe_domain": "googleapis.com"
          }
          EOF
          
      - name: Test snapsave.py
        run: pipenv run python snapsave.py --help
        
      - name: Test snapsave-g-drive.py
        run: pipenv run python snapsave-g-drive.py --help
        
      - name: Test g-drive-browser.py
        run: echo "" | pipenv run python g-drive-browser.py